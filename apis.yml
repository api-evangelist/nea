aid: nea
name: New Enterprise Associates
description: >-
  New Enterprise Associates (NEA) is one of the world's largest and longest-running
  venture capital firms, founded in 1977 by Dick Kramlich, Chuck Newhall, and Frank
  Bonsal. Headquartered in Menlo Park, California, with offices in Timonium (Maryland),
  New York, and London, NEA invests across the full company lifecycle — "from idea to
  IPO" — spanning seed, Series A, and later growth rounds. The firm has raised over
  $27 billion in committed capital (as of December 31, 2024) and organizes into
  specialized practice groups across two core sectors: technology (enterprise software,
  consumer, fintech, AI, infrastructure) and healthcare (biopharma, life sciences,
  digital health, and medical devices). NEA is known for an active, hands-on partnership
  model and long-term support of category-defining companies, with a portfolio that has
  produced many notable IPOs and acquisitions including Cloudflare, MongoDB, Robinhood,
  Coursera, Databricks, Plaid, and Tempus.
